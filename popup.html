<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #4ade80;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .github-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    .github-link:hover {
      background: #334155;
      color: #ffffff;
      border-color: #4ade80;
    }
    .version {
      font-size: 11px;
      background: #1e293b;
      color: #94a3b8;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid #334155;
    }

    /* Thanh điều khiển Bật/Tắt cho trang web hiện tại */
    .site-control-card {
      margin-top: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .site-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .site-label {
      font-size: 11px;
      color: #94a3b8;
    }
    .site-name {
      color: #f8fafc;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .site-status-text {
      font-size: 11px;
      margin-top: 2px;
      color: #4ade80;
    }
    .site-status-text.off {
      color: #f87171;
    }

    /* Switch thanh gạt */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #475569;
      transition: 0.25s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.25s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #16a34a;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    input:disabled + .slider {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 24px;
      font-weight: 800;
      color: #4ade80;
      line-height: 1.2;
    }
    .stat-num.total {
      color: #38bdf8;
    }
    .stat-label {
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-toggle {
      background: #16a34a;
      color: #ffffff;
    }
    .btn-toggle:hover {
      background: #15803d;
    }
    .btn-clear {
      flex: 0 0 auto;
      background: #334155;
      color: #cbd5e1;
    }
    .btn-clear:hover {
      background: #475569;
    }

    .details-wrapper {
      display: none;
      margin-top: 12px;
      border-top: 1px solid #1e293b;
      padding-top: 10px;
    }
    .details-wrapper.open {
      display: block;
    }
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .tab-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #334155;
      color: #f8fafc;
      font-weight: 600;
    }
    .blocked-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }
    .blocked-list::-webkit-scrollbar {
      width: 5px;
    }
    .blocked-list::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .log-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 11.5px;
    }
    .log-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .log-badge {
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }
    .log-time {
      color: #64748b;
      font-size: 10.5px;
    }
    .log-url {
      color: #e2e8f0;
      word-break: break-all;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.35;
    }
    .log-source {
      color: #94a3b8;
      font-size: 10.5px;
      margin-top: 3px;
    }
    .empty-msg {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🛡️ AdBlocker by xTer-Inc</div>
    <div class="header-right">
      <a
        href="https://github.com/xTer-Inc"
        target="_blank"
        rel="noopener noreferrer"
        class="github-link"
        id="githubBtn"
        title="GitHub: xTer-Inc"
      >
        <svg height="15" width="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
      </a>
      <span class="version">v1.0.2.0</span>
    </div>
  </div>

  <div class="site-control-card">
    <div class="site-info">
      <span class="site-label">Trang web hiện tại</span>
      <span class="site-name" id="currentHost">Đang tải...</span>
      <span class="site-status-text" id="siteStatusText">Đang bảo vệ trang này</span>
    </div>
    <label class="switch" title="Bật/Tắt chặn quảng cáo cho trang web này">
      <input type="checkbox" id="siteToggleSwitch" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="tabBlockedCount">0</div>
      <div class="stat-label">Đã chặn trên tab này</div>
    </div>
    <div class="stat-card">
      <div class="stat-num total" id="totalBlockedCount">0</div>
      <div class="stat-label">Tổng đã chặn</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-toggle" id="toggleDetailsBtn">▼ Xem danh sách đã chặn</button>
    <button class="btn btn-clear" id="clearLogsBtn" title="Xóa toàn bộ lịch sử">Xóa</button>
  </div>

  <div class="details-wrapper" id="detailsWrapper">
    <div class="filter-tabs">
      <button class="tab-btn active" data-filter="tab">Tab hiện tại</button>
      <button class="tab-btn" data-filter="all">Tất cả các trang</button>
    </div>
    <div class="blocked-list" id="blockedList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
